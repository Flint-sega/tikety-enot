[project]
name = "tikety-enot"
version = "2.0.0"
description = "Тикеты Енот v2 — веб-панель заявок: FastAPI + SQLite, интеграции UseDesk и Telegram"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "bcrypt>=4.1",
    "itsdangerous>=2.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
