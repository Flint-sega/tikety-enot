{% extends "base.html" %}
{% block title %}Шаблон — Тикеты Енот{% endblock %}
{% block content %}
<div class="page-panel mx-auto max-w-xl">
    <div class="flex items-center justify-between">
        <h1 class="text-lg font-semibold">Шаблон «{{ template.name }}»</h1>
        <a href="/admin" class="text-sm text-slate-500 hover:text-slate-700">&larr; К админке</a>
    </div>
    {% if error %}
    <p class="mt-3 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
    {% endif %}
    <form method="post" action="/admin/templates/{{ template.id }}/edit" class="mt-4 space-y-4 rounded-lg border border-slate-200 bg-white p-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div>
            <label for="tpl-name" class="block text-sm font-medium text-slate-700">Название</label>
            <input id="tpl-name" name="name" value="{{ template.name }}"
                   class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none">
        </div>
        <div>
            <label for="tpl-title" class="block text-sm font-medium text-slate-700">Маска заголовка</label>
            <input id="tpl-title" name="title_tpl" value="{{ template.title_tpl }}"
                   class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none">
        </div>
        <div>
            <label for="tpl-description" class="block text-sm font-medium text-slate-700">Маска описания</label>
            <textarea id="tpl-description" name="description_tpl" rows="4"
                      class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none">{{ template.description_tpl }}</textarea>
        </div>
        <div class="flex items-center gap-3">
            <button type="submit" class="rounded-md bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700">Сохранить</button>
            <a href="/admin" class="text-sm text-slate-500 hover:text-slate-700">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
